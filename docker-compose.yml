name: ecommerce

x-catalog-image: &catalog-image
  image: ecommerce/catalog:dev
  pull_policy: never

x-catalog-build: &catalog-build
  context: ./backend
  dockerfile: services/catalog/Dockerfile

x-auth-image: &auth-image
  image: ecommerce/auth:dev
  pull_policy: never

x-auth-build: &auth-build
  context: ./backend
  dockerfile: services/auth/Dockerfile

x-auth-database-environment: &auth-database-environment
  AUTH_DB_HOST: postgres
  AUTH_DB_PORT: "5432"
  AUTH_DB_NAME: auth_db
  AUTH_DB_USER: auth_user
  AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}

x-accounts-image: &accounts-image
  image: ecommerce/accounts:dev
  pull_policy: never

x-accounts-build: &accounts-build
  context: ./backend
  dockerfile: services/accounts/Dockerfile

x-accounts-database-environment: &accounts-database-environment
  ACCOUNTS_DB_HOST: postgres
  ACCOUNTS_DB_PORT: "5432"
  ACCOUNTS_DB_NAME: accounts_db
  ACCOUNTS_DB_USER: accounts_user
  ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD}

x-jwt-environment: &jwt-environment
  JWT_ISSUER: ${JWT_ISSUER:-ecommerce-auth}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-ecommerce-api}
  JWT_JWKS_CACHE_TTL_SECONDS: ${JWT_JWKS_CACHE_TTL_SECONDS:-300}

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis-cart:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        exec redis-server --requirepass "$$REDIS_PASSWORD"
        --maxmemory 256mb --maxmemory-policy noeviction
        --appendonly yes --appendfsync everysec
    environment:
      REDIS_PASSWORD: ${REDIS_CART_PASSWORD}
      REDISCLI_AUTH: ${REDIS_CART_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_CART_HOST_PORT}:6379"
    volumes:
      - redis-cart-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-cache:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        exec redis-server --requirepass "$$REDIS_PASSWORD"
        --maxmemory 256mb --maxmemory-policy allkeys-lru
        --save "" --appendonly no
    environment:
      REDIS_PASSWORD: ${REDIS_CACHE_PASSWORD}
      REDISCLI_AUTH: ${REDIS_CACHE_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_CACHE_HOST_PORT}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.2.2
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:${KAFKA_EXTERNAL_PORT}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.2.2
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["sh", "/scripts/create-topics.sh"]
    volumes:
      - ./infra/kafka/create-topics.sh:/scripts/create-topics.sh:ro

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:${KAFKA_UI_HOST_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  object-storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/start.sh"]
    environment:
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_MEDIA_BUCKET: ${OBJECT_STORAGE_MEDIA_BUCKET}
    ports:
      - "127.0.0.1:${OBJECT_STORAGE_HOST_PORT}:8333"
    volumes:
      - object-storage-data:/data
      - ./infra/object-storage/start.sh:/scripts/start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8333/healthz && wget -q --spider http://localhost:9333/cluster/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  object-storage-init:
    image: amazon/aws-cli:2.38.0
    restart: "no"
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint: ["sh", "/scripts/create-buckets.sh"]
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      AWS_DEFAULT_REGION: ${OBJECT_STORAGE_REGION}
      AWS_ENDPOINT_URL: http://object-storage:8333
      OBJECT_STORAGE_MEDIA_BUCKET: ${OBJECT_STORAGE_MEDIA_BUCKET}
      OBJECT_STORAGE_IMPORTS_BUCKET: ${OBJECT_STORAGE_IMPORTS_BUCKET}
    volumes:
      - ./infra/object-storage/create-buckets.sh:/scripts/create-buckets.sh:ro

  gateway:
    image: traefik:v3.7.14
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_PORT}:80"
      - "127.0.0.1:${GATEWAY_DASHBOARD_PORT}:8080"
    volumes:
      - ./infra/gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/gateway/dynamic:/etc/traefik/dynamic:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  auth-migrate:
    <<: *auth-image
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m auth.tools.seed"]
    environment:
      <<: *auth-database-environment
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:?set AUTH_ADMIN_EMAIL in .env}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:?set AUTH_ADMIN_PASSWORD in .env}

  auth:
    <<: *auth-image
    pull_policy: build
    build: *auth-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
    environment:
      <<: [*jwt-environment, *auth-database-environment]
      AUTH_KEYS_DIR: /keys
      AUTH_GENERATE_KEY_IF_MISSING: "true"
      ROOT_PATH: /auth
    volumes:
      - auth-keys:/keys
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  auth-worker:
    <<: *auth-image
    restart: unless-stopped
    command: ["python", "-m", "auth.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *auth-database-environment
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  accounts-migrate:
    <<: *accounts-image
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *accounts-database-environment

  accounts:
    <<: *accounts-image
    pull_policy: build
    build: *accounts-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      accounts-migrate:
        condition: service_completed_successfully
    environment:
      <<: [*jwt-environment, *accounts-database-environment]
      JWT_JWKS_URL: http://auth:8000/api/v1/auth/.well-known/jwks.json
      ROOT_PATH: /accounts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  accounts-worker:
    <<: *accounts-image
    restart: unless-stopped
    command: ["python", "-m", "accounts.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      accounts-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      <<: *accounts-database-environment
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  catalog-migrate:
    <<: *catalog-image
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    environment:
      CATALOG_DB_HOST: postgres
      CATALOG_DB_PORT: "5432"
      CATALOG_DB_NAME: catalog_db
      CATALOG_DB_USER: catalog_user
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}

  catalog:
    <<: *catalog-image
    pull_policy: build
    build: *catalog-build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      catalog-migrate:
        condition: service_completed_successfully
    environment:
      <<: *jwt-environment
      CATALOG_DB_HOST: postgres
      CATALOG_DB_PORT: "5432"
      CATALOG_DB_NAME: catalog_db
      CATALOG_DB_USER: catalog_user
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      JWT_JWKS_URL: http://auth:8000/api/v1/auth/.well-known/jwks.json
      ROOT_PATH: /catalog
      CATALOG_SEARCH_TIMEOUT_MS: ${CATALOG_SEARCH_TIMEOUT_MS:-2000}
      OBJECT_STORAGE_ENDPOINT: http://object-storage:8333
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_MEDIA_BUCKET: ${OBJECT_STORAGE_MEDIA_BUCKET:-media}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://127.0.0.1:${GATEWAY_HTTP_PORT:-8000}/media}
      OBJECT_STORAGE_IMPORTS_BUCKET: ${OBJECT_STORAGE_IMPORTS_BUCKET:-imports}
      IMPORT_MAX_BYTES: ${IMPORT_MAX_BYTES:-52428800}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  catalog-worker:
    <<: *catalog-image
    restart: unless-stopped
    command: ["python", "-m", "catalog.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      catalog-migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    environment:
      <<: *jwt-environment
      CATALOG_DB_HOST: postgres
      CATALOG_DB_PORT: "5432"
      CATALOG_DB_NAME: catalog_db
      CATALOG_DB_USER: catalog_user
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      JWT_JWKS_URL: http://auth:8000/api/v1/auth/.well-known/jwks.json
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OBJECT_STORAGE_ENDPOINT: http://object-storage:8333
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_MEDIA_BUCKET: ${OBJECT_STORAGE_MEDIA_BUCKET:-media}
      OBJECT_STORAGE_IMPORTS_BUCKET: ${OBJECT_STORAGE_IMPORTS_BUCKET:-imports}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://127.0.0.1:${GATEWAY_HTTP_PORT:-8000}/media}

volumes:
  auth-keys:
  postgres-data:
  redis-cart-data:
  kafka-data:
  object-storage-data:
