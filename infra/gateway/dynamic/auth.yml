http:
  routers:
    auth-login:
      rule: "Path(`/api/v1/auth/login`) && Method(`POST`)"
      priority: 100
      entryPoints: [web]
      middlewares: [auth-login-rate-limit]
      service: auth
    auth-register:
      rule: "Path(`/api/v1/auth/register`) && Method(`POST`)"
      priority: 100
      entryPoints: [web]
      middlewares: [auth-register-rate-limit]
      service: auth
    auth-api:
      rule: "PathPrefix(`/api/v1/auth`)"
      entryPoints: [web]
      service: auth
    auth-docs:
      rule: "Path(`/auth`) || PathPrefix(`/auth/`)"
      entryPoints: [web]
      middlewares: [auth-strip-prefix]
      service: auth

  middlewares:
    auth-strip-prefix:
      stripPrefix:
        prefixes: ["/auth"]
    auth-login-rate-limit:
      rateLimit:
        average: 10
        period: 1m
        burst: 10
    auth-register-rate-limit:
      rateLimit:
        average: 5
        period: 1m
        burst: 5

  services:
    auth:
      loadBalancer:
        servers:
          - url: "http://auth:8000"
