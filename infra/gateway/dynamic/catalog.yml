http:
  routers:
    catalog-api:
      rule: "PathPrefix(`/api/v1/products`) || PathPrefix(`/api/v1/categories`) || PathPrefix(`/api/v1/imports`)"
      entryPoints: [web]
      service: catalog
    catalog-docs:
      rule: "PathPrefix(`/catalog`)"
      entryPoints: [web]
      middlewares: [catalog-strip-prefix]
      service: catalog

  middlewares:
    catalog-strip-prefix:
      stripPrefix:
        prefixes: ["/catalog"]

  services:
    catalog:
      loadBalancer:
        servers:
          - url: "http://catalog:8000"
