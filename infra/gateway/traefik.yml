entryPoints:
  web:
    address: ":80"
    http:
      aliasHeadersStrategy: delete
    forwardedHeaders:
      trustedIPs:
        - "10.250.10.2/32"
        - "10.250.10.3/32"
  traefik:
    address: ":8080"

api:
  dashboard: true
  insecure: true

ping:
  entryPoint: traefik

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO
