name: frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version-file: backend/.python-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies with the frozen lockfile
        run: make install-frontend

      - name: Lint and typecheck
        run: make lint-frontend

      - name: Test with coverage
        run: make test-frontend

      - name: Fail on comments in backend and frontend code
        run: make check-comments

      - name: Test the comment checker with the TypeScript toolchain available
        run: make test-scripts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-coverage
          path: frontend/**/coverage
          if-no-files-found: ignore

  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies with the frozen lockfile
        run: make install-frontend

      - name: Install the browser for the Storybook test runner
        run: corepack pnpm --dir frontend --filter @ecommerce/ui exec playwright install --with-deps chromium

      - name: Build Storybook and run every story with axe
        run: make test-storybook

  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version-file: backend/.python-version
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies with the frozen lockfile
        run: make install-frontend

      - name: Fail when the committed OpenAPI specs or generated types are stale
        run: make check-openapi

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [store, backoffice]
        include:
          - app: store
            probe: /login
          - app: backoffice
            probe: /admin/login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build --file frontend/apps/${{ matrix.app }}/Dockerfile --tag ecommerce/${{ matrix.app }}:ci frontend

      - name: Check the image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id ecommerce/${{ matrix.app }}:ci -u)" != "0"

      - name: Start the image without any backend and check it answers
        run: |
          docker run --detach --name app --publish 3000:3000 \
            --env API_BASE_URL=http://gateway.invalid:80 \
            ecommerce/${{ matrix.app }}:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000${{ matrix.probe }}; then
              exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1
