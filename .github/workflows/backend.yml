name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "scripts/**"
      - "Makefile"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version-file: backend/.python-version
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Lint and typecheck
        run: make lint-backend

      - name: Docker is available for the Testcontainers suites
        run: docker info --format 'Docker {{.ServerVersion}} on {{.OperatingSystem}}'

      - name: Test with coverage (all suites, Testcontainers included) and per-package thresholds
        run: make test-backend

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: |
            backend/htmlcov
            backend/coverage.xml
          if-no-files-found: ignore

  catalog-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build catalog image
        run: docker build --file backend/services/catalog/Dockerfile --tag ecommerce/catalog:ci backend

      - name: Check the image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id ecommerce/catalog:ci -u)" != "0"

  auth-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build auth image
        run: docker build --file backend/services/auth/Dockerfile --tag ecommerce/auth:ci backend

      - name: Check the image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id ecommerce/auth:ci -u)" != "0"

  accounts-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build accounts image
        run: docker build --file backend/services/accounts/Dockerfile --tag ecommerce/accounts:ci backend

      - name: Check the image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id ecommerce/accounts:ci -u)" != "0"

  orders-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build orders image
        run: docker build --file backend/services/orders/Dockerfile --tag ecommerce/orders:ci backend

      - name: Check the image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id ecommerce/orders:ci -u)" != "0"

  payments-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build payments image
        run: docker build --file backend/services/payments/Dockerfile --tag ecommerce/payments:ci backend

      - name: Check the image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id ecommerce/payments:ci -u)" != "0"

  cart-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build cart image
        run: docker build --file backend/services/cart/Dockerfile --tag ecommerce/cart:ci backend

      - name: Check the image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id ecommerce/cart:ci -u)" != "0"
