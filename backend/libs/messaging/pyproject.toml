[project]
name = "ecommerce-messaging"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiokafka>=0.12",
    "ecommerce-contracts",
    "sqlalchemy[asyncio]>=2.0",
]

[tool.uv.sources]
ecommerce-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_messaging"]
