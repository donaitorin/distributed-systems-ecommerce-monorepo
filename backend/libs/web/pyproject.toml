[project]
name = "ecommerce-web"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ecommerce-auth",
    "ecommerce-observability",
    "fastapi>=0.115",
]

[tool.uv.sources]
ecommerce-auth = { workspace = true }
ecommerce-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_web"]
