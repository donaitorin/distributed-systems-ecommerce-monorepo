[project]
name = "ecommerce-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ecommerce-observability",
    "ecommerce-contracts",
    "ecommerce-auth",
    "ecommerce-storage",
    "ecommerce-web",
    "ecommerce-catalog",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.35",
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers[postgres]>=4.9",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
ecommerce-observability = { workspace = true }
ecommerce-contracts = { workspace = true }
ecommerce-auth = { workspace = true }
ecommerce-storage = { workspace = true }
ecommerce-web = { workspace = true }
ecommerce-catalog = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
src = [
    "test_support",
    "libs/observability/src",
    "libs/contracts/src",
    "libs/auth/src",
    "libs/storage/src",
    "libs/web/src",
    "services/catalog/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "N", "RUF", "C4", "PT", "ERA", "T20"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = [
    "libs/observability/src",
    "libs/contracts/src",
    "libs/auth/src",
    "libs/storage/src",
    "libs/web/src",
    "services/catalog/src",
    "services/catalog/tests",
    "test_support",
]

[tool.pytest.ini_options]
testpaths = ["libs", "services"]
pythonpath = ["services/catalog/tests", "test_support"]
markers = ["integration: needs Docker (Testcontainers)"]
asyncio_mode = "auto"
filterwarnings = ["ignore::PIL.Image.DecompressionBombWarning"]
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--import-mode=importlib",
    "--cov",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=85",
]

[tool.coverage.run]
source = ["libs", "services"]
omit = ["*/tests/*"]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
