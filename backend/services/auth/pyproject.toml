[project]
name = "ecommerce-auth-service"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "ecommerce-auth",
    "ecommerce-contracts",
    "ecommerce-messaging",
    "ecommerce-observability",
    "ecommerce-web",
    "pyjwt[crypto]>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.32",
]

[tool.uv.sources]
ecommerce-auth = { workspace = true }
ecommerce-contracts = { workspace = true }
ecommerce-messaging = { workspace = true }
ecommerce-observability = { workspace = true }
ecommerce-web = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth"]
