[project]
name = "ecommerce-cart-service"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ecommerce-auth",
    "ecommerce-contracts",
    "ecommerce-messaging",
    "ecommerce-observability",
    "ecommerce-storage",
    "ecommerce-web",
    "httpx>=0.28",
    "redis>=5.2",
    "uvicorn>=0.32",
]

[tool.uv.sources]
ecommerce-auth = { workspace = true }
ecommerce-contracts = { workspace = true }
ecommerce-messaging = { workspace = true }
ecommerce-observability = { workspace = true }
ecommerce-storage = { workspace = true }
ecommerce-web = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cart"]
